<!doctype html>
<!-- Шаблон OG-картинки 1200×630. Скриншот: node tools/make-og.js → assets/img/og-ru.jpg -->
<html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Onest:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#0D0D0D;color:#fff;font-family:Onest,sans-serif}
.og{position:relative;width:1200px;height:630px;padding:56px 64px;overflow:hidden}
.ghost{position:absolute;right:-40px;top:20px;font:800 230px/1 Unbounded;letter-spacing:-.04em;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.12);text-transform:uppercase}
.rings{position:absolute;right:-150px;bottom:-330px;width:820px;height:820px;border-radius:50%;border:1px solid rgba(255,255,255,.09)}
.rings::after{content:"";position:absolute;inset:-60px;border-radius:50%;border:1px solid rgba(255,255,255,.05)}
.sun{position:absolute;right:40px;bottom:50px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#FF8A4C 0%,#F2541F 38%,#C92A12 72%,#8E1A09 100%);box-shadow:0 0 120px 10px rgba(255,90,30,.35)}
.photo{position:absolute;right:-24px;bottom:-6px;height:520px}
.coin{position:absolute;filter:drop-shadow(0 16px 20px rgba(0,0,0,.5))}
.c1{width:104px;right:330px;top:66px;transform:rotate(-10deg)}
.c2{width:84px;right:14px;top:360px;transform:rotate(8deg)}
.logo{font:800 30px/1 Unbounded}.logo span{color:#FF6A2A}
.pill{display:inline-flex;align-items:center;gap:10px;margin-top:40px;padding:10px 18px;border-radius:999px;background:#181818;border:1px solid rgba(255,106,42,.5);font:600 20px/1 Onest}
.pill::before{content:"";width:10px;height:10px;border-radius:50%;background:#FF6A2A;box-shadow:0 0 0 5px rgba(255,106,42,.2)}
h1{position:relative;z-index:2;margin-top:22px;font:800 88px/1 Unbounded;letter-spacing:-.035em;text-transform:uppercase}
h1 span{color:#FF6A2A}
.sub{position:relative;z-index:2;margin-top:18px;max-width:600px;font:500 30px/1.25 Unbounded;letter-spacing:-.01em}
.sub em{font-style:normal;color:#FF6A2A}
.chips{position:absolute;left:64px;bottom:52px;display:flex;gap:12px}
.chip{display:inline-flex;align-items:center;gap:10px;padding:10px 18px 10px 10px;border-radius:999px;background:#fff;color:#111;font:700 20px/1 Onest}
.chip i{width:30px;height:30px;border-radius:50%;background:#D9361A;display:grid;place-items:center}
.chip svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<div class="og">
  <span class="ghost">Abbos</span><span class="rings"></span><span class="sun"></span>
  <img class="photo" src="../assets/img/hero-abbos.webp" alt="">
  <img class="coin c1" src="../assets/img/3d/coin-som.webp" alt="">
  <img class="coin c2" src="../assets/img/3d/coin-usd.webp" alt="">
  <div class="logo">abbos<span>.</span></div>
  <div class="pill">Meta Ads · Разблокировка · Аудит</div>
  <h1>Забанили<span>?</span></h1>
  <p class="sub">Разберусь, за что, и помогу <em>вернуть рекламу в работу.</em></p>
  <div class="chips">
    <span class="chip"><i><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.2-4.2"/></svg></i>Диагностика бесплатно</span>
    <span class="chip"><i><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/><path d="m9 12 2 2 4-4"/></svg></i>Без паролей</span>
  </div>
</div>
</body></html>
